name: release

# 按 tag 触发：推 v1.2.3 这样的 tag 即产出发布。
# 只接受 v 前缀（vMAJOR.MINOR.PATCH），避免普通分支名/任意 tag 误触发。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 建 Release / 上传资产需要

env:
  GO_VERSION: '1.27.1'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
            upx: upx
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
            upx: upx

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史给版本号推导留余地

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ── 测试与静态检查（发布门禁）──
      # 此前流水线只有 build/release，仓库里 8 个测试包从未在 CI 跑过。
      # internal/sender 下的 *_live_test.go 由环境变量门控，未设 BDSYNC_COOKIE
      # 等变量时会自行 t.Skip，因此不需要凭据也不会让 CI 变红。
      - name: 单元测试（含竞态检测）
        run: go test -race ./...
      - name: 静态检查
        run: go vet ./...

      # ── 版本号：以 tag 为准（用户要求"运行时版本号跟着 tag 走"）──
      # tag 形如 v1.2.3 → 注入 -X main.version=v1.2.3。
      # 代码里是 `var version = defaultVersion` 而不是 const —— const 无法被 -X 覆写。
      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 校验 vMAJOR.MINOR.PATCH 语义，避免 vfoo 这类 tag 混进产物名
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
            echo "::error::tag '$TAG' 不符合 vMAJOR.MINOR.PATCH 语义"
            exit 1
          fi
          echo "注入 -X main.version=$TAG"

      - name: 安装 UPX
        shell: bash
        run: |
          set -euo pipefail
          UPX_VER="5.2.1"
          case "${{ matrix.os }}" in
            windows-latest) ASSET="upx-${UPX_VER}-win64.zip" ;;
            ubuntu-latest)  ASSET="upx-${UPX_VER}-amd64_linux.tar.xz" ;;
          esac
          # ⚠ 已知加固缺口：这里下载后直接执行，没有校验 sha256/签名。
          # 上游 release 被投毒或 CDN 被劫持即污染发布产物。补齐方式：从
          # https://github.com/upx/upx/releases 取官方 checksum 后加一行
          #   echo "<sha256>  upx-dl" | sha256sum -c -
          # 放在解包之前（不要凭记忆填值，必须与所选版本的官方清单核对）。
          curl -fsSL -o upx-dl "https://github.com/upx/upx/releases/download/v${UPX_VER}/${ASSET}"
          mkdir -p upx
          if [[ "$ASSET" == *.zip ]]; then
            unzip -q -o upx-dl -d upx
          else
            tar -xJf upx-dl -C upx --strip-components=1
          fi
          # 两种资产的目录结构/文件名都不同：
          #   win64.zip   → upx/upx-5.2.1-win64/upx.exe
          #   linux.tar.xz → upx/upx
          # 所以按名字通配找，不写死路径（写死过一次，Linux 侧先过了、Windows 侧因
          # zip 多一层目录而找不到）。
          UPDBIN="$(find upx -type f \( -name upx -o -name upx.exe \) | head -n1)"
          [ -n "$UPDBIN" ] || { echo "::error::解包里没有 upx 可执行文件"; find upx -type f; exit 1; }
          chmod +x "$UPDBIN"
          echo "UPX_BIN=$UPDBIN" >> "$GITHUB_ENV"
          "$UPDBIN" --version | head -n1

      - name: 构建
        shell: bash
        # tag 必须先落到环境变量再进脚本：直接写 ${{ steps.ver.outputs.tag }}
        # 等于把外部输入插值进 bash 源码，而 git ref 名允许 $ ( ) ; ` | 等字符，
        # 形如 v1.0.0-$(cmd) 的 tag 会被二次求值执行（校验正则允许 [-+].* 后缀）。
        # matrix.* 来自本工作流自身定义、非外部输入，保留原样。
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          OUT="bdsync-${{ matrix.target }}${{ matrix.ext }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "$OUT" ./cmd/bdsync
          ls -lh "$OUT"
          # ⚠ 版本号必须在这里校验，**不能**放到 UPX 之后：
          # UPX 会把字符串段编码压缩，压缩后 grep 必然找不到（实测确认）。
          # 这条检查防的是 -X 静默失效 —— 那会让产物版本号永远停在默认值。
          # 用 -F 固定串匹配：tag 允许含正则元字符，普通 -a 会失配。
          if grep -qaF "$TAG" "$OUT"; then
            echo "✓ 版本号 $TAG 已嵌入二进制"
          else
            echo "::error::二进制里找不到版本号，检查 -X main.version 是否生效"
            exit 1
          fi

      - name: UPX 压缩
        shell: bash
        run: |
          set -euo pipefail
          OUT="bdsync-${{ matrix.target }}${{ matrix.ext }}"
          RAW="bdsync-${{ matrix.target }}-raw${{ matrix.ext }}"
          cp "$OUT" "$RAW"
          # wc -c 跨平台（stat -c 是 GNU 专有，Windows 的 bash 不一定有）
          BEFORE=$(wc -c < "$RAW")
          # --best --lzma：实测 Go 二进制 17.4MB → 5.4MB（约 69%）。
          # UPX 压过的二进制仍可正常运行，且不破坏 PE 资源段（图标/manifest 保留）。
          "$UPX_BIN" --best --lzma --no-backup "$OUT"
          AFTER=$(wc -c < "$OUT")
          echo "压缩前: $((BEFORE/1024/1024)) MB  压缩后: $((AFTER/1024/1024)) MB  压缩率: $(( (BEFORE-AFTER)*100/BEFORE ))%"
          # 压缩必须真的生效，否则说明 UPX 静默跳过了（会白等一轮 CI）
          [ "$AFTER" -lt "$BEFORE" ] || { echo "::error::UPX 未减小体积"; exit 1; }
          # 校验压缩没把二进制搞坏
          if [ "${{ matrix.goos }}" = "windows" ]; then
            file "$OUT" | grep -qi 'pe32' || { echo "::error::产物不是有效 PE32"; exit 1; }
          else
            file "$OUT" | grep -qi 'elf' || { echo "::error::产物不是有效 ELF"; exit 1; }
          fi

      - name: 校验产物
        shell: bash
        run: |
          set -euo pipefail
          OUT="bdsync-${{ matrix.target }}${{ matrix.ext }}"
          test -s "$OUT" || { echo "::error::产物为空"; exit 1; }
          sha256sum "$OUT" > "$OUT.sha256"
          cat "$OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bdsync-${{ matrix.target }}
          path: |
            bdsync-${{ matrix.target }}${{ matrix.ext }}
            bdsync-${{ matrix.target }}${{ matrix.ext }}.sha256
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build          # 两个平台都成功才发
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和与说明
        run: |
          set -euo pipefail
          ls -lh dist/
          {
            echo "## 产物"
            echo
            echo '| 平台 | 文件 |'
            echo '|---|---|'
            echo "| Windows amd64 | \`bdsync-windows-amd64.exe\` |"
            echo "| Linux amd64 | \`bdsync-linux-amd64\` |"
            echo
            echo "版本 \`${{ github.ref_name }}\` · UPX --best --lzma 压缩 · CGO 已关闭（静态链接）"
          } > dist/NOTES.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: dist/NOTES.md
          files: |
            dist/bdsync-windows-amd64.exe
            dist/bdsync-windows-amd64.exe.sha256
            dist/bdsync-linux-amd64
            dist/bdsync-linux-amd64.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
